plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'com.affclix.sdk'
    compileSdk 35

    defaultConfig {
        minSdk 21
        targetSdk 35
        consumerProguardFiles "consumer-rules.pro"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // SDK version injected into BuildConfig — single source of truth
        buildConfigField "String", "SDK_VERSION", "\"1.0.0\""
        buildConfigField "String", "SDK_PLATFORM", "\"android\""
    }

    buildTypes {
        release {
            minifyEnabled false   // host app handles shrinking via consumerProguardFiles
        }
        debug {
            testCoverageEnabled true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    buildFeatures { buildConfig true }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    // AndroidX core
    implementation 'androidx.core:core-ktx:1.13.1'

    // Encrypted SharedPreferences (attribution IDs, visitor ID)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // HTTP client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Install Referrer API v2 (Google Play, replaces legacy INSTALL_REFERRER broadcast)
    implementation 'com.android.installreferrer:installreferrer:2.2'

    // GAID / Advertising ID
    implementation 'com.google.android.gms:play-services-ads-identifier:18.1.0'

    // WorkManager — offline event queue delivery (CONNECTED constraint)
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // Annotations
    implementation 'androidx.annotation:annotation:1.8.2'

    // ── Test ──────────────────────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit:1.9.24'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test:core-ktx:1.6.1'
    testImplementation 'androidx.test:runner:1.6.2'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

// Release artifact for JitPack (built from a git tag): com.github.affclix:affclix-android-sdk:<tag>
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId    = 'com.github.affclix'
                artifactId = 'affclix-android-sdk'
                version    = '1.0.0'
            }
        }
    }
}
